name: Release Artifact

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build + Package Release Artifact
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build App
        run: Scripts/build.sh
      - name: Install dmgbuild
        run: Scripts/install_dmgbuild.sh
      - name: Package (Zip + DMG, no appcast)
        run: Scripts/release.sh --skip-appcast
      - name: Preflight (Local — Notarization Stays Manual)
        run: Scripts/release_preflight.sh
      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            build/releases/*/SexiQL-*.zip
            build/releases/*/SexiQL-*.zip.sha256
            build/releases/*/SexiQL-*.dmg
            build/releases/*/SexiQL-*.dmg.sha256
          retention-days: 90
